{% block title %}
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<div class="login-container">

    <!-- 1. Arka Plan Videosu (Doğrudan ana container içine) -->
    <video class="bg-video" autoplay muted playsinline>
        <source src="{{ url_for('static', filename='images/background_video.mp4') }}" type="video/mp4">
    </video>

    <!-- 2. Sol Taraf (Başlık) -->
    <div class="left-panel">
        <div class="overlay">
            <h1>
                <span>Tea</span>
                <span>Tracking</span>
                <span>System</span>
            </h1>
            <p>Smart Tea Production Management Platform</p>
        </div>
    </div>

    <!-- 3. Sağ Taraf (Orijinal Form Kartı) -->
    <div class="right-panel">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Please sign in to continue.</p>

            <form action="/" method="post">
                <div class="input-group">
                    <label for="tc">Turkish Identity Number</label>
                    <input type="text" id="tc" name="tc" placeholder="Enter your TC Identity Number" maxlength="11" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" id="login-button">Login</button>

                <div class="auth-footer">
                    <span>Don't have an account?</span>
                    <a href="{{ url_for('signup_page') }}">Register as Farmer</a>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
