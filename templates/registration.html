<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Farmer Registration</h2>
      <p>Create your application to join the Tea Tracking System</p>
    </div>

    <!-- Dosya yükleme olduğu için enctype="multipart/form-data" zorunludur -->
    <form action="{{ url_for('registration_page') }}" method="POST" enctype="multipart/form-data" id="registrationForm"
      class="auth-form" autocomplete="off">

      <!-- TC Numarası -->
      <div class="field-group">
        <label for="tc_no">TC Number</label>
        <input type="text" id="tc_no" name="tc_no" maxlength="11" pattern="\d{11}" placeholder="11-digit TC Number"
          inputmode="numeric" required>
      </div>

      <!-- Ad ve Soyad -->
      <div class="field-row">
        <div class="field-group">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" placeholder="First Name" required>
        </div>
        <div class="field-group">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" placeholder="Last Name" required>
        </div>
      </div>

      <!-- Telefon Numarası -->
      <div class="field-group">
        <label for="phone_number">Phone Number</label>
        <input type="tel" id="phone_number" name="phone_number" placeholder="05XXXXXXXXX" required>
      </div>

      <!-- Konum: İl, İlçe, Köy -->
      <div class="field-row-three">
        <div class="field-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" placeholder="e.g. Rize" required>
        </div>
        <div class="field-group">
          <label for="district">District</label>
          <input type="text" id="district" name="district" placeholder="e.g. Çayeli" required>
        </div>
        <div class="field-group">
          <label for="village">Village</label>
          <input type="text" id="village" name="village" placeholder="Village / Area" required>
        </div>
      </div>

      <!-- Şifre ve Tekrarı -->
      <div class="field-row">
        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" minlength="8" placeholder="At least 8 chars" required>
            <button type="button" class="toggle-eye" data-target="password">👁</button>
          </div>
        </div>
        <div class="field-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
            <button type="button" class="toggle-eye" data-target="confirm_password">👁</button>
          </div>
        </div>
      </div>

      <!-- Land Register (Tapu Dosyası Yükleme) -->
      <div class="field-group file-field">
        <label for="land_register">Land Register Document</label>
        <div class="file-upload-box">
          <input type="file" id="land_register" name="land_register" required accept=".pdf,.jpg,.jpeg,.png">
          <span class="file-hint">Accepted formats: PDF, PNG, JPG (Max 5MB)</span>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="registrationSubmitBtn">Submit Application</button>


    </form>
    <div class="auth-footer">
      <span>Already have an account?</span>
      <a href="{{ url_for('home') }}">Log In</a>
    </div>

  </div>

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  function showGlassAlert(title, text, icon = 'info') {
    return Swal.fire({
      title: title,
      text: text,
      icon: icon, // 'success', 'error', 'warning', 'info'
      confirmButtonColor: '#3a7d44',
      confirmButtonText: 'OK',
      customClass: {
        popup: 'glass-swal'
      }
    });
  }

  const registrationSubmitBtn = document.getElementById("registrationSubmitBtn");

  registrationSubmitBtn.addEventListener("click", function (event) {
    event.preventDefault(); // Formun otomatik gönderilmesini engelle

    const form = document.getElementById("registrationForm");
    const formData = new FormData(form);

    const registrationData = {
      tc_no: formData.get("tc_no"),
      first_name: formData.get("first_name"),
      last_name: formData.get("last_name"),
      phone_number: formData.get("phone_number"),
      city: formData.get("city"),
      district: formData.get("district"),
      village: formData.get("village"),
      password: formData.get("password"),
      confirm_password: formData.get("confirm_password"),
    };
    if (registrationData.password !== registrationData.confirm_password) {
      showGlassAlert("Error", "Passwords do not match.", "error");
      return;
    } if (registrationData.password.length < 8) {
      showGlassAlert("Error", "Password must be at least 8 characters long.", "error");
      return;
    }
    if (!/^\d{11}$/.test(registrationData.tc_no)) {
      showGlassAlert("Error", "TC Number must be exactly 11 digits.", "error");
      return;
    }
    if (!/^[a-zA-Z]+$/.test(registrationData.first_name) || !/^[a-zA-Z]+$/.test(registrationData.last_name)) {
      showGlassAlert("Error", "First Name and Last Name must contain only letters.", "error");
      return;
    }
    if (!/^[a-zA-Z]+$/.test(registrationData.city)) {
      showGlassAlert("Error", "City must contain only letters.", "error");
      return;
    }
    if (!/^[a-zA-Z]+$/.test(registrationData.district)) {
      showGlassAlert("Error", "District must contain only letters.", "error");
      return;
    }
    if (!/^[a-zA-Z]+$/.test(registrationData.village)) {
      showGlassAlert("Error", "Village must contain only letters.", "error");
      return;
    }
    if (!/^\d+$/.test(registrationData.phone_number)) {
      showGlassAlert("Error", "Phone Number must contain only digits.", "error");
      return;
    }
    if (registrationData.phone_number.length < 10 || registrationData.phone_number.length > 15) {
      showGlassAlert("Error", "Phone Number must be between 10 and 15 digits.", "error");
      return;
    }
    if (!formData.get("land_register")) {
      showGlassAlert("Error", "Please upload the Land Register document.", "error");
      return;
    }
    if (formData.get("land_register").size > 5 * 1024 * 1024) {
      showGlassAlert("Error", "Land Register document must be less than 5MB.", "error");
      return;
    }


    fetch("{{ url_for('registration_page_api') }}", {
      method: "POST",
      body: formData,
    })
      .then((response) => response.json())
      .then((data) => {
        if (data.success) {
          showGlassAlert("Success", data.message, "success");
          form.reset(); // Formu sıfırla
        } else {
          showGlassAlert("Error", data.message, "error");
        }
      })
      .catch((error) => {
        console.error("Error:", error);
        showGlassAlert("Error", "An unexpected error occurred.", "error");
      });
  });






  document.querySelectorAll('.toggle-eye').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      target.type = target.type === 'password' ? 'text' : 'password';
    });
  });
  document.addEventListener("DOMContentLoaded", function () {
    const fileInput = document.getElementById("land_register");

    const ALLOWED_EXTENSIONS = ["pdf", "jpg", "jpeg", "png"];
    const ALLOWED_MIME_TYPES = [
      "application/pdf",
      "image/jpeg",
      "image/png"
    ];
    const MAX_FILE_SIZE_MB = 5;

    if (fileInput) {
      fileInput.addEventListener("change", function () {
        const file = fileInput.files[0];
        if (!file) return;

        const extension = file.name.split(".").pop().toLowerCase();
        const isValidExtension = ALLOWED_EXTENSIONS.includes(extension);
        const isValidMime = ALLOWED_MIME_TYPES.includes(file.type);

        if (!isValidExtension || !isValidMime) {
          showGlassAlert(
            "Invalid File Type",
            `"${file.name}" is not a supported file type. Please upload a PDF, JPG, or PNG file.`,
            "error"
          );
          fileInput.value = ""; // seçimi sıfırla
          return;
        }

        const fileSizeMB = file.size / (1024 * 1024);
        if (fileSizeMB > MAX_FILE_SIZE_MB) {
          showGlassAlert(
            "File Too Large",
            `"${file.name}" exceeds the ${MAX_FILE_SIZE_MB}MB size limit.`,
            "error"
          );
          fileInput.value = "";
          return;
        }
      });
    }
  });
</script>
{% endblock %}
