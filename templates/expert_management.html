

{% extends "layout.html" %}

{% block title %}
Expert Management
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Expert Management</h1>
        <p>View and manage registered experts.</p>
    </div>
    <div class="button-container">
       <a href="{{url_for('add_expert_route')}}" class="expert_ekle">
        + New Expert
         </a>
    </div>


</div>


<!-- ================= SEARCH ================= -->

<div class="search-content-card">

    <h2>Search Experts</h2>

    <div class="filter-options">

        <!-- Name -->
        <div class="filter-item">

            <label>
                <input
                    type="checkbox"
                    class="filter-checkbox"
                    data-target="nameFilter"
                >
                Name
            </label>

            <div
                id="nameFilter"
                class="filter-input"
                
            >
                <input
                    type="text"
                    id="name"
                    placeholder="Enter first name"
                >
            </div>

        </div>


        <!-- Surname -->
        <div class="filter-item">

            <label>
                <input
                    type="checkbox"
                    class="filter-checkbox"
                    data-target="surnameFilter"
                >
                Surname
            </label>

            <div
                id="surnameFilter"
                class="filter-input"
                
            >
                <input
                    type="text"
                    id="surname"
                    placeholder="Enter last name"
                >
            </div>

        </div>


        <!-- TC Number -->
        <div class="filter-item">

            <label>
                <input
                    type="checkbox"
                    class="filter-checkbox"
                    data-target="tcFilter"
                >
                TC Number
            </label>

            <div
                id="tcFilter"
                class="filter-input"
                
            >
                <input
                    type="text"
                    id="tc"
                    placeholder="Enter TC number"
                >
            </div>

        </div>



    </div>
    <div style="display: flex; justify-content: center;">
    
        <button style="margin-top: 25px; display: flex;"
            type="button"
            id="searchExpertsButton"
            class="btn"
        >
            Show Results
        </button>
        </div>
</div>


<!-- ================= EXPERT TABLE ================= -->
<div class="content-card">
    <h2>Experts</h2>
    <div class="table-container">
        <table class="experts">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>TC Number</th>
                    <th>Name</th>
                    <th>Surname</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="expert-table-body">
                <!-- Javascript arama sonuçlarını buraya basacak -->
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
{% block scripts %}



<script>
    const tableBody = document.getElementById("expert-table-body");

    // 1. SİLME İŞLEMİ (Event Delegation ile)
    // 1. SİLME İŞLEMİ (Event Delegation ile)
    tableBody.addEventListener("click", function(event) {
        if (event.target.classList.contains("btn-delete")) {
            const button = event.target;
            const url = button.getAttribute("data-url");

            // Eski tip confirm() yerine cam tasarımlı SweetAlert
            Swal.fire({
                title: 'Are you sure?',
                text: "You want to delete this expert?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d32f2f',
                cancelButtonColor: 'transparent',
                confirmButtonText: 'Yes, delete it!',
                customClass: {
                    popup: 'glass-swal',
                    cancelButton: 'swal-cancel-btn'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch(url, { method: "POST" })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Eski alert() yerine showGlassAlert
                            showGlassAlert("Deleted!", data.message, "success");
                            
                            // Hata vermeden satırı güvenli silme
                            const row = button.closest("tr");
                            if (row) {
                                row.remove();
                            }
                        } else {
                            // Eski alert() yerine showGlassAlert
                            showGlassAlert("Failed!", data.message, "error");
                        }
                    })
                    .catch(error => {
                        console.error("Error:", error);
                        showGlassAlert("Error!", "An error occurred while deleting the expert.", "error");
                    });
                }
            });
        }
    });

    document
    .getElementById("searchExpertsButton")
    .addEventListener("click", function () {

        const filters = {};

        const name =
            document.getElementById("name").value.trim();

        const surname =
            document.getElementById("surname").value.trim();

        const tc =
            document.getElementById("tc").value.trim();


        const nameChecked =
            document.querySelector(
                '[data-target="nameFilter"]'
            ).checked;

        const surnameChecked =
            document.querySelector(
                '[data-target="surnameFilter"]'
            ).checked;

        const tcChecked =
            document.querySelector(
                '[data-target="tcFilter"]'
            ).checked;


        // En az bir filtre seçilmeli
        if (!nameChecked && !surnameChecked && !tcChecked) {

            showGlassAlert(
                "Warning",
                "Please select at least one filter.",
                "warning"
            );

            return;
        }


        // Name
        if (nameChecked) {

            if (!name) {

                showGlassAlert(
                    "Warning",
                    "Please enter a name.",
                    "warning"
                );

                return;
            }

            if (!isLettersOnly(name)) {

                showGlassAlert(
                    "Error",
                    "Name can contain only letters.",
                    "error"
                );

                return;
            }

            filters.name = name;
        }


        // Surname
        if (surnameChecked) {

            if (!surname) {

                showGlassAlert(
                    "Warning",
                    "Please enter a surname.",
                    "warning"
                );

                return;
            }

            if (!isLettersOnly(surname)) {

                showGlassAlert(
                    "Error",
                    "Surname can contain only letters.",
                    "error"
                );

                return;
            }

            filters.surname = surname;
        }


        // TC
        if (tcChecked) {

            if (!tc) {

                showGlassAlert(
                    "Warning",
                    "Please enter a TC number.",
                    "warning"
                );

                return;
            }

            if (!isDigitsOnly(tc)) {

                showGlassAlert(
                    "Error",
                    "TC Number can contain only digits.",
                    "error"
                );

                return;
            }

            if (tc.length !== 11) {

                showGlassAlert(
                    "Error",
                    "TC Number must contain exactly 11 digits.",
                    "error"
                );

                return;
            }

            filters.tc = tc;
        }


        console.log("Expert filters:", filters);


        fetch("/api/experts/search", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                filters: filters
            })

        })

        .then(response => response.json())

        .then(data => {

            console.log("Backend response:", data);

            if (!data.success) {

                showGlassAlert(
                    "Error",
                    data.message,
                    "error"
                );

                return;
            }

            displayExperts(data.experts);

        })

        .catch(error => {

            console.error("Search error:", error);

            showGlassAlert(
                "Error",
                "An error occurred while searching experts.",
                "error"
            );

        });

    });
    function displayExperts(experts) {

    const tableBody =
        document.getElementById("expert-table-body");

    tableBody.innerHTML = "";

    experts.forEach(function (expert) {

        const row = `
            <tr>

                <td>${expert[0]}</td>

                <td>${expert[1]}</td>

                <td>
                    ${expert[2]} </td>
                <td>${expert[3]}</td>
                <td>

                    <button
                        type="button"
                        class="btn-delete"
                        data-url="/admin/experts/delete/${expert[0]}">

                        Delete

                    </button>

                </td>

            </tr>
        `;

        tableBody.innerHTML += row;

    });

}

</script>
{% endblock %}
