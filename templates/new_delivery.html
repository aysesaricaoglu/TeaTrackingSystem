{% extends "layout.html" %}

{% block title %}
New Tea Delivery
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>New Tea Delivery</h2>
            <p>Enter delivery details below</p>
        </div>

        <form id="delivery-form" method="POST" action="{{ url_for('new_delivery') }}">
            <div class="field-group">
                <label for="farmer_tc">Farmer TC Number</label>
                <input type="text" name="farmer_tc" placeholder="Enter Farmer TC Number" required id="farmer_tc" maxlength="11">
            </div>

            <div class="field-group">
                <label for="gross_weight">Gross Weight (kg)</label>
                <input type="number" name="gross_weight" placeholder="Enter Gross Weight" step="0.01" required id="gross_weight">
            </div>

            <div class="field-row">
                <div class="field-group">
                    <label for="is_rainy">Is it raining?</label>
                    <select name="is_rainy" id="is_rainy">
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="payment_option">Payment Option</label>
                    <select name="payment_option" id="payment_option">
                        <option>Immediate</option>
                        <option>1 Month</option>
                        <option>3 Months</option>
                    </select>
                </div>
            </div>

            <div class="field-group">
                <label for="delivery_date">Delivery Date</label>
                <input type="date" name="delivery_date" required id="delivery_date">
            </div>

            <button type="submit" class="submit-btn" id="saveBtn">
                Save Delivery
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    console.log("NEW DELIVERY JS CALISTI");

    document.getElementById("delivery-form").addEventListener("submit", function (event) {
        event.preventDefault();
        console.log("FORM SUBMIT CALISTI");

        // Buton referansını al ve devre dışı bırak
        const saveBtn = document.getElementById("saveBtn");
        if (saveBtn) {
            saveBtn.disabled = true;
            saveBtn.innerText = "Saving...";
        }

        const data = {
            farmer_tc: document.getElementById("farmer_tc").value,
            delivery_date: document.getElementById("delivery_date").value,
            gross_weight: document.getElementById("gross_weight").value,
            is_rainy: document.getElementById("is_rainy").value,
            payment_option: document.getElementById("payment_option").value
        };
        
        fetch("{{ url_for('create_delivery') }}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Kullanıcı SweetAlert üzerindeki 'OK' butonuna bastığında yönlendirir
                    showGlassAlert("Delivery added successfully!", data.message, "success",() => {
                        window.location.href = "/new-delivery";
                    });
                } else {
                    alert(data.message);
                    saveBtn.disabled = false;
                    saveBtn.innerText = "Save Delivery";
                }

            })
        .catch(error => {
            console.error("Error:", error);
            showGlassAlert("Error", "Something went wrong.", "error");
            if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.innerText = "Save Delivery";
            }
        });
    });
</script>
{% endblock %}
