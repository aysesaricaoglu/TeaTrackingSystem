<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tea Tracking System{% endblock %}</title>
    
    <!-- Ortak CSS Dosyamız -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Sayfaya özel ekstra CSS gerekirse diye -->
    {% block css %}{% endblock %}
</head>
<body>

    <div class="dashboard-container">
        
        <!-- ORTAK SIDEBAR İSKELETİ -->
        <div class="sidebar">
            <h2>🌿 Tea Tracking</h2>
            <ul>
                <!-- Menü linkleri kullanıcının rolüne göre bu bloğa gelecek -->
                {% block sidebar_links %}{% endblock %}
            </ul>
        </div>

        <!-- ORTAK ANA İÇERİK İSKELETİ -->
        <div class="main-content">
            <!-- Sayfanın asıl içeriği (Tablolar, formlar, kartlar) bu bloğa gelecek -->
            {% block content %}{% endblock %}
        </div>

    </div>

    <!-- Sayfaya özel JavaScript kodları için -->
    {% block scripts %}{% endblock %}
</body>
</html>
